<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NEXORA PARTY - Admin Dashboard</title>
        <link rel="stylesheet" href="admin-style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
            rel="stylesheet">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    </head>
    <body>

        <div class="admin-container">
            <aside class="sidebar">
                <div class="sidebar-brand">
                    <h2>NEXORA</h2>
                    <span>CORE CONTROL</span>
                </div>

                <div class="admin-user-profile"
                    style="padding: 15px; background: rgba(59, 130, 246, 0.1); border-radius: 12px; margin: 20px 0; border: 1px solid rgba(59, 130, 246, 0.2);">
                    <span
                        style="display: block; color: #64748b; font-size: 0.75rem; margin-bottom: 4px;">ผู้ใช้งานปัจจุบัน:</span>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <i class="fa-solid fa-circle-user"
                            style="color: #60a5fa; font-size: 1.2rem;"></i>
                        <span id="admin-display-name"
                            style="color: #ffffff; font-weight: 500; font-size: 0.95rem;">Loading...</span>
                    </div>
                </div>

                <div class="stats-panel">
                    <div class="stat-box">
                        <span class="stat-label">ผู้สมัครทั้งหมด</span>
                        <span class="stat-number" id="total-applicants">0</span>
                    </div>
                </div>

                <div class="logout-panel" style="margin-top: auto;">
                    <button type="button" onclick="adminLogout()"
                        class="btn-logout">
                        <i class="fa-solid fa-power-off"></i> ออกจากระบบ
                    </button>
                </div>
            </aside>

            <main class="main-content">
                <header class="content-header">
                    <div class="header-title">
                        <h1>รายชื่อผู้สมัครเข้าร่วมพรรค</h1>
                        <p>ระบบจัดการและตรวจสอบข้อมูลสมาชิกแบบเรียลไทม์</p>
                    </div>

                    <div class="search-box">
                        <input type="text" id="search-input"
                            placeholder="ค้นหาด้วยชื่อ หรือ ระดับชั้น...">
                    </div>
                </header>

                <div id="loading-state" class="loading-box">
                    <div class="spinner"></div>
                    <p>กำลังดึงข้อมูลจาก NEXORA DATABASE...</p>
                </div>

                <div id="applicants-grid" class="applicants-grid"></div>
            </main>
        </div>

        <div id="detail-modal" class="modal-overlay">
            <div class="modal-content">
                <button type="button" class="modal-close-btn"
                    onclick="closeModal()">&times;</button>
                <div id="modal-body-content">
                </div>
            </div>
        </div>

        <script src="admin-script.js"></script>
    </body>
</html>
